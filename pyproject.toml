[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlsentinel"
version = "1.0.0"
description = "Scope-controlled, non-destructive SQL injection auditing CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.7,<3",
  "jinja2>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21"]

[project.scripts]
sqlsentinel = "sqlsentinel.cli:app"

[tool.setuptools.packages.find]
include = ["sqlsentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
